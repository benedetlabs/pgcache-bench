# Synthetic benchmark lab — pgbench / sysbench against origin and PgCache.
#
# WHY THIS EXISTS, AND WHAT IT CHANGES ABOUT THE QUESTION
#
# Every subject so far (openFGA, NetBox, Strapi) was a real application, and the
# platform's question was "does PgCache beat the application's own cache". A
# synthetic benchmark has no application tier and no path C, so that question
# cannot be asked here. What CAN be asked, and never could be with a real app,
# is the one the real subjects kept failing to reach:
#
#   openFGA r5/r6 ran at 40-160 rps against an origin at a 99.93% buffer hit
#   rate. The origin was bored. A cache cannot help a bored origin.
#
# pgbench and sysbench can saturate an origin. That makes the honest question
# here a CURVE, not a point: at what origin utilisation does PgCache stop
# costing and start paying? A single-client p99 comparison against a warm
# origin is the worst case for PgCache by construction and is not the result.
#
# WHY THE ORIGIN'S CONFIG IS FROZEN
#
# shared_buffers is pinned at 1 GB, identical to the openFGA and NetBox labs, so
# the scale ladder measures scale and not "how much RAM did Postgres get". The
# ladder grows the DATASET past that; it never shrinks the buffer pool. Those
# are not the same move -- C9 forbids the second one ("do not fix this by
# strangling the origin") and the whole r8 campaign was killed for doing it.
name: pgcache-synthetic-lab

services:
  origin:
    image: postgres:17
    command: >
      postgres -c shared_buffers=1GB -c max_connections=400
               -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
               -c wal_level=logical -c max_replication_slots=8
               -c max_wal_senders=8
               -c track_io_timing=on
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: benchpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes: [origin-data:/var/lib/postgresql/data]
    ports: ["55433:5432"]

  pgcache:
    image: pgcache/pgcache:latest
    depends_on:
      origin: {condition: service_healthy}
    environment:
      UPSTREAM_URL: postgres://bench:benchpass@origin:5432/bench
      LISTEN_PORT: "6432"
      METRICS_PORT: "9090"
      NUM_WORKERS: "4"
      # pgbench's four tables plus sysbench's. pgbench_history is write-only in
      # tpcb-like and never read, but it is listed so an invalidation on it is
      # observable rather than silently out of scope.
      ALLOWED_TABLES: "pgbench_accounts,pgbench_branches,pgbench_tellers,pgbench_history,sbtest1,sbtest2,sbtest3,sbtest4"
      PGCACHE_TELEMETRY: "off"
    ports: ["56433:6432", "59091:9090"]

  # The load client. Ships pgbench (postgres:17); sysbench is installed into it
  # separately. Runs in the same compose network so the A/B network distance is
  # one hop on both paths -- the client is NOT on the host, because a host-to-
  # container hop on Docker Desktop for macOS costs more than the entire effect
  # being measured.
  client:
    image: postgres:17
    depends_on:
      origin: {condition: service_healthy}
    environment:
      PGPASSWORD: benchpass
    volumes:
      - ./scripts:/scripts:ro
      - ./results:/results
    working_dir: /scripts
    entrypoint: ["sleep", "infinity"]

volumes:
  origin-data:
