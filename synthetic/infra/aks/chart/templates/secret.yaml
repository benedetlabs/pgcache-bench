{{/*
The origin's password, in one place.

It is a Secret rather than a plain env var so the value is not printed by
`kubectl describe` on every pod that uses it. That is the whole ambition: this is
an ephemeral lab on a private network, the password is in values.yaml in clear,
and nothing here is a credential-management design.

A cluster that is exposed needs Workload Identity and Key Vault instead, and the
`origin.password` value should then be removed rather than left as a fallback.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: lab-db
  labels: {{- include "lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.origin.password | quote }}
